  <button class="menu-toggle" id="menuToggleButton" onclick="toggleMobileMenu()" aria-label="Toggle Navigation" aria-expanded="false">
    <span class="bar"></span>
    <span class="bar"></span>

  </button>

  <ul class="nav-links" id="navLinks">

  </button>

<!-- CART OVERLAY + DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()" aria-hidden="true"></div>
<div class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-labelledby="cartDrawerTitle" aria-hidden="true" tabindex="-1">
  <div class="cart-drawer-header">
    <div class="cart-drawer-title" id="cartDrawerTitle">Your Mystery Haul</div>
    <button class="cart-close" onclick="closeCart()" aria-label="Close cart">✕</button>
  </div>
  <div id="drawerItems"></div>
  <div class="drawer-footer" id="drawerFooter" style="display:none">
    <div class="drawer-total">
      <span>Total</span>
      <span class="drawer-total-val" id="drawerTotal">৳0</span>
    </div>
    <a href="order.html" class="btn-primary" style="display:block;text-align:center;width:100%;padding:1rem;" onclick="closeCart()">Proceed to Order</a>
  </div>
</div>

<!-- NOTIFY MODAL -->
<div class="notify-overlay" id="notifyOverlay" onclick="closeNotify()" aria-hidden="true"></div>
<div class="notify-modal" id="notifyModal" role="dialog" aria-modal="true" aria-labelledby="notifyTitle" aria-hidden="true" tabindex="-1">
  <button class="notify-close" onclick="closeNotify()" aria-label="Close notification dialog">✕</button>
  <h3 class="notify-title" id="notifyTitle">Notify me</h3>
  <p class="notify-desc">Enter your WhatsApp number and we'll message you when it's available.</p>
  <input class="form-input" id="notifyPhone" type="tel" placeholder="01X-XXXXXXXXX" />
  <div id="notifySuccess" style="display:none;margin-top:1rem;color:var(--sage)">Thanks — opening WhatsApp now...</div>
  <div style="margin-top:1rem;display:flex;gap:0.5rem;">
    <button class="btn-primary" onclick="submitNotify()">Send</button>
    <button class="btn-outline" onclick="closeNotify()">Cancel</button>
  </div>
</div>
